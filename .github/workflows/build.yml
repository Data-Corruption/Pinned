name: Build / Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    if: ${{ vars.CI_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache APT packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-cache-ubuntu-latest-${{ hashFiles('go.mod') }}
          restore-keys: |
            apt-cache-ubuntu-latest-

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          
          # Force non-interactive installation to prevent prompts from hanging the build
          export DEBIAN_FRONTEND=noninteractive
          
          # Enable APT caching
          sudo rm -f /etc/apt/apt.conf.d/docker-clean
          echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/keep-cache
          
          sudo -E apt-get update
          sudo -E apt-get install -y --no-install-recommends \
            gcc \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            linux-libc-dev-arm64-cross
          
          # Install latest rclone via their official fast script (APT version is often old/slow)
          curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Build (and release if applicable)
        shell: bash
        env:
          VERBOSE: ${{ vars.VERBOSE }}
          TAILWIND_VERSION: ${{ vars.TAILWIND_VERSION }}
          DAISYUI_VERSION: ${{ vars.DAISYUI_VERSION }}
          REFETCH_TOOLS: ${{ vars.REFETCH_TOOLS }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          chmod +x scripts/build.sh
          ./scripts/build.sh
